[package]
name = "imf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
leptos = "0.8.0"
leptos_router = "0.8.0"
axum = { version = "0.8.0", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8.0", optional = true }
leptos_meta = { version = "0.8.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window", "Document", "FocusOptions"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A mint's initial is its first grapheme, so an emoji-only name keeps its emoji.
unicode-segmentation = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
thiserror = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
nostr-sdk = { version = "0.44.1", default-features = false, optional = true }
url = { version = "2.5", optional = true }

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "dep:chrono",
]
ssr = [
    "dep:url",
    "dep:axum",
    "dep:tower-http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:tracing-subscriber",
    "dep:nostr-sdk",
    "dep:chrono",
    "dep:rusqlite",
    "dep:thiserror",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
nostr-relay-builder = "0.44"

[package.metadata.leptos]
output-name = "imf"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
wasm-opt-features = [
    "-Oz",
    "--enable-reference-types",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
]
