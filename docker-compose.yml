services:
  imf:
    image: imf:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMF_PORT:-3000}:3000"
    environment:
      IMF_DATA_DIR: /data
      IMF_RELAYS: ${IMF_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net,wss://relay.cashumints.space,wss://relay.nostr.net}
      BASE_URL: ${BASE_URL:-http://localhost:${IMF_PORT:-3000}}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - imf_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 40s
volumes:
  imf_data:
