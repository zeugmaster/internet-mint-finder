x-cdk-mintd-env: &cdk-mintd-env
  CDK_MINTD_LISTEN_HOST: "0.0.0.0"
  CDK_MINTD_LISTEN_PORT: "8085"
  CDK_MINTD_LN_BACKEND: "fakewallet"
  CDK_MINTD_DATABASE: "sqlite"
  CDK_MINTD_CACHE_BACKEND: "memory"
  CDK_MINTD_PROMETHEUS_ENABLED: "false"
  CDK_MINTD_FAKE_WALLET_SUPPORTED_UNITS: "sat"
  CDK_MINTD_FAKE_WALLET_FEE_PERCENT: "0.02"
  CDK_MINTD_FAKE_WALLET_RESERVE_FEE_MIN: "1"
  CDK_MINTD_FAKE_WALLET_MIN_DELAY: "1"
  CDK_MINTD_FAKE_WALLET_MAX_DELAY: "3"

x-cdk-mintd: &cdk-mintd
  image: cashubtc/mintd:0.17.7  # 0.18+ needs a TOML imported with `config init`; 0.17 still reads env vars
  restart: unless-stopped
  command: ["cdk-mintd"]

services:
  # Two instances share one relay so the mirror can be watched locally:
  # whatever instance A audits shows up on B (and vice versa) within a minute.
  # Keys below are throwaway dev keys; never reuse them. Swaps run every
  # 20-60 s, and the relay is also listed as ws://localhost:7777 so the
  # browser review form can reach it through the published port (the app
  # logs a refused connection for that address; harmless).
  auditor:
    build:
      context: .
      dockerfile: Dockerfile
    image: imf:latest
    container_name: imf-a
    restart: unless-stopped
    depends_on:
      - strfry
      - mint-one
      - mint-two
      - mint-three
      - mint-four
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      APP_NAME: "IMF A (dev)"
      CDK_MNEMONIC: "shock rally bird garage senior false farm picture duty rack vault donkey"
      IMF_NOSTR_NSEC: nsec1dqusu47ykkazha56pucayjc83ypuhv007yenc2wkp85e7rt0avzs6mh6f2
      IMF_AUDITORS: npub17dyrarcleswq8sf7zt0v9hda894nfm8sxjpqqracupffyd7gzlzsc0azqn,npub1zx0xhymkaywxpycg3jz9rf25p7wna3mly0us7ughdzs5l4avdczsjy9t2r
      IMF_RELAYS: ws://strfry:7777,ws://localhost:7777
      AUDITOR_MIN_DELAY_SECS: "20"
      AUDITOR_MAX_DELAY_SECS: "60"
      IMF_PUBLIC_URLS: http://localhost:3000
      AUDITOR_MINT_URL_ALIASES: >-
        http://0.0.0.0:8085=http://mint-one:8085,
        http://localhost:8085=http://mint-one:8085,
        http://127.0.0.1:8085=http://mint-one:8085,
        http://0.0.0.0:8086=http://mint-two:8085,
        http://localhost:8086=http://mint-two:8085,
        http://127.0.0.1:8086=http://mint-two:8085,
        http://0.0.0.0:8087=http://mint-three:8085,
        http://localhost:8087=http://mint-three:8085,
        http://127.0.0.1:8087=http://mint-three:8085,
        http://0.0.0.0:8088=http://mint-four:8085,
        http://localhost:8088=http://mint-four:8085,
        http://127.0.0.1:8088=http://mint-four:8085
    volumes:
      - auditor-data:/data

  auditor-b:
    image: imf:latest
    container_name: imf-b
    restart: unless-stopped
    depends_on:
      - auditor
    ports:
      - "3001:3000"
    environment:
      APP_NAME: "IMF B (dev)"
      CDK_MNEMONIC: "private position month coconut club error above park absurd divorce symbol blind"
      IMF_NOSTR_NSEC: nsec178dq4dlpc6t8vkgac4gh3h9xcyp7tsmlrzyuxfgf4h5nyaf5u9lsmrg7hg
      IMF_AUDITORS: npub17dyrarcleswq8sf7zt0v9hda894nfm8sxjpqqracupffyd7gzlzsc0azqn,npub1zx0xhymkaywxpycg3jz9rf25p7wna3mly0us7ughdzs5l4avdczsjy9t2r
      IMF_RELAYS: ws://strfry:7777,ws://localhost:7777
      AUDITOR_MIN_DELAY_SECS: "20"
      AUDITOR_MAX_DELAY_SECS: "60"
      IMF_PUBLIC_URLS: http://localhost:3001
      AUDITOR_MINT_URL_ALIASES: >-
        http://0.0.0.0:8085=http://mint-one:8085,
        http://localhost:8085=http://mint-one:8085,
        http://127.0.0.1:8085=http://mint-one:8085,
        http://0.0.0.0:8086=http://mint-two:8085,
        http://localhost:8086=http://mint-two:8085,
        http://127.0.0.1:8086=http://mint-two:8085,
        http://0.0.0.0:8087=http://mint-three:8085,
        http://localhost:8087=http://mint-three:8085,
        http://127.0.0.1:8087=http://mint-three:8085,
        http://0.0.0.0:8088=http://mint-four:8085,
        http://localhost:8088=http://mint-four:8085,
        http://127.0.0.1:8088=http://mint-four:8085
    volumes:
      - auditor-b-data:/data

  strfry:
    image: ghcr.io/hoytech/strfry:latest
    container_name: imf-strfry
    restart: unless-stopped
    command: ["relay"]
    volumes:
      - ./deploy/strfry/strfry.conf:/etc/strfry.conf:ro
      - strfry-data:/app/strfry-db
    ports:
      - "7777:7777"

  mint-one:
    <<: *cdk-mintd
    container_name: cdk-auditor-mint-one
    ports:
      - "8085:8085"
    environment:
      <<: *cdk-mintd-env
      CDK_MINTD_URL: "http://mint-one:8085"
      CDK_MINTD_SEED: "cashu-auditor-test-mint-one"
      CDK_MINTD_MINT_NAME: "Auditor Test Mint One"
      CDK_MINTD_MINT_DESCRIPTION: "Fake-wallet mint for local auditor testing"
    volumes:
      - mint-one-data:/root/.cdk-mintd

  mint-two:
    <<: *cdk-mintd
    container_name: cdk-auditor-mint-two
    ports:
      - "8086:8085"
    environment:
      <<: *cdk-mintd-env
      CDK_MINTD_URL: "http://mint-two:8085"
      CDK_MINTD_SEED: "cashu-auditor-test-mint-two"
      CDK_MINTD_MINT_NAME: "Auditor Test Mint Two"
      CDK_MINTD_MINT_DESCRIPTION: "Fake-wallet mint for local auditor testing"
    volumes:
      - mint-two-data:/root/.cdk-mintd

  mint-three:
    <<: *cdk-mintd
    container_name: cdk-auditor-mint-three
    ports:
      - "8087:8085"
    environment:
      <<: *cdk-mintd-env
      CDK_MINTD_URL: "http://mint-three:8085"
      CDK_MINTD_SEED: "cashu-auditor-test-mint-three"
      CDK_MINTD_MINT_NAME: "Auditor Test Mint Three"
      CDK_MINTD_MINT_DESCRIPTION: "Fake-wallet mint for local auditor testing"
    volumes:
      - mint-three-data:/root/.cdk-mintd

  mint-four:
    <<: *cdk-mintd
    container_name: cdk-auditor-mint-four
    ports:
      - "8088:8085"
    environment:
      <<: *cdk-mintd-env
      CDK_MINTD_URL: "http://mint-four:8085"
      CDK_MINTD_SEED: "cashu-auditor-test-mint-four"
      CDK_MINTD_MINT_NAME: "Auditor Test Mint Four"
      CDK_MINTD_MINT_DESCRIPTION: "Fake-wallet mint for local auditor testing"
    volumes:
      - mint-four-data:/root/.cdk-mintd

volumes:
  auditor-data:
  auditor-b-data:
  strfry-data:
  mint-one-data:
  mint-two-data:
  mint-three-data:
  mint-four-data:
