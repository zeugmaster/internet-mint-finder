apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imf-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: imf
  template:
    metadata:
      labels:
        app: imf
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: imf
          image: imf:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: IMF_DATA_DIR
              value: /data
            - name: IMF_RELAYS
              value: wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net,wss://relay.cashumints.space,wss://relay.nostr.net
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: imf-data
---
apiVersion: v1
kind: Service
metadata:
  name: imf
spec:
  selector:
    app: imf
  ports:
    - name: http
      port: 80
      targetPort: http
